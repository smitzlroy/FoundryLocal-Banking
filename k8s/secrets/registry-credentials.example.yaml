# Template for the registry pull secret used by BYO ModelDeployments.
#
# DO NOT commit a filled-in copy. Prefer creating it imperatively:
#
#   kubectl create secret generic registry-credentials \
#     -n foundry-local-operator \
#     --from-literal=username='<acr-username-or-spn-id>' \
#     --from-literal=password='<acr-password-or-token>'
#
# Or apply this file after base64-encoding the values.
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: foundry-local-operator
type: Opaque
stringData:
  username: "<ACR_USERNAME_OR_SPN_APP_ID>"
  password: "<ACR_PASSWORD_OR_ACCESS_TOKEN>"
